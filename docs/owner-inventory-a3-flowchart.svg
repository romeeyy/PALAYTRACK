<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1250" viewBox="0 0 1600 1250" role="img" aria-labelledby="title desc">
  <title id="title">A.3 Owner Inventory Flowchart</title>
  <desc id="desc">Detailed flow for viewing current palay and milled-rice inventory from the Owner navigation menu.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8fafc"/><stop offset="1" stop-color="#eef7ec"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#0f172a" flood-opacity=".12"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#475569"/></marker>
    <style>
      .title{font:800 34px Arial,sans-serif;fill:#0f172a}.subtitle{font:400 17px Arial,sans-serif;fill:#64748b}
      .label{font:700 18px Arial,sans-serif;fill:#0f172a;text-anchor:middle;dominant-baseline:middle}.small{font:600 14px Arial,sans-serif;fill:#475569;text-anchor:middle}
      .branch{font:700 15px Arial,sans-serif;fill:#334155}.flow{fill:none;stroke:#475569;stroke-width:3;marker-end:url(#arrow)}
      .dataflow{fill:none;stroke:#2563eb;stroke-width:2.5;stroke-dasharray:8 6;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1600" height="1250" fill="url(#bg)"/>
  <text x="800" y="48" class="title" text-anchor="middle">A.3 — Owner Inventory Flowchart</text>
  <text x="800" y="78" class="subtitle" text-anchor="middle">Runs when the Owner selects “Inventory” from the navigation menu</text>

  <!-- Off-page connector A.3 -->
  <g filter="url(#shadow)">
    <path d="M725 108 H875 V170 L800 216 L725 170 Z" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
    <text x="800" y="154" class="label">A.3</text>
  </g>

  <!-- Request page -->
  <g filter="url(#shadow)">
    <rect x="610" y="255" width="380" height="78" fill="#fff" stroke="#64748b" stroke-width="3"/>
    <text x="800" y="284" class="label">Request Inventory Page</text>
    <text x="800" y="313" class="small">Open Owner inventory module</text>
  </g>

  <!-- Authorization decision -->
  <g filter="url(#shadow)">
    <polygon points="800,378 970,450 800,522 630,450" fill="#fef3c7" stroke="#d97706" stroke-width="3"/>
    <text x="800" y="439" class="label">Authenticated</text>
    <text x="800" y="465" class="label">Owner?</text>
  </g>

  <!-- Denied display -->
  <g filter="url(#shadow)">
    <path d="M155 410 Q110 450 155 490 H455 Q515 450 455 410 Z" fill="#fff1f2" stroke="#e11d48" stroke-width="3"/>
    <text x="305" y="441" class="label">Display Login Page</text>
    <text x="305" y="469" class="small">Access denied</text>
  </g>

  <!-- Query process -->
  <g filter="url(#shadow)">
    <rect x="600" y="570" width="400" height="90" fill="#fff" stroke="#64748b" stroke-width="3"/>
    <text x="800" y="600" class="label">Retrieve Inventory Records</text>
    <text x="800" y="630" class="small">Load inventory logs, deliveries, and rice types</text>
  </g>

  <!-- Database -->
  <g filter="url(#shadow)">
    <path d="M1150 548 C1150 523 1340 523 1340 548 V638 C1340 663 1150 663 1150 638 Z" fill="#e0f2fe" stroke="#0284c7" stroke-width="3"/>
    <ellipse cx="1245" cy="548" rx="95" ry="25" fill="#bae6fd" stroke="#0284c7" stroke-width="3"/>
    <path d="M1150 592 C1150 617 1340 617 1340 592" fill="none" stroke="#0284c7" stroke-width="2"/>
    <text x="1245" y="576" class="label">Inventory Database</text>
    <text x="1245" y="637" class="small">Inventory movement ledger</text>
  </g>

  <!-- Calculate totals -->
  <g filter="url(#shadow)">
    <rect x="505" y="715" width="590" height="130" fill="#f0fdf4" stroke="#15803d" stroke-width="3"/>
    <text x="800" y="747" class="label">Calculate Current Inventory Balances</text>
    <text x="800" y="780" class="small">Palay balance = Total Palay IN − Total Palay OUT</text>
    <text x="800" y="807" class="small">Milled-rice balance = Total Milled Rice IN − Total Milled Rice OUT</text>
    <text x="800" y="833" class="small">Group both balances by rice type</text>
  </g>

  <!-- Validity decision -->
  <g filter="url(#shadow)">
    <polygon points="800,895 980,970 800,1045 620,970" fill="#fef3c7" stroke="#d97706" stroke-width="3"/>
    <text x="800" y="959" class="label">Inventory records</text>
    <text x="800" y="985" class="label">available?</text>
  </g>

  <!-- Empty state display -->
  <g filter="url(#shadow)">
    <path d="M155 930 Q110 970 155 1010 H465 Q525 970 465 930 Z" fill="#f8fafc" stroke="#64748b" stroke-width="3"/>
    <text x="310" y="961" class="label">Display Empty Inventory</text>
    <text x="310" y="989" class="small">No inventory data yet</text>
  </g>

  <!-- Inventory screen -->
  <g filter="url(#shadow)">
    <path d="M1050 895 Q990 970 1050 1045 H1480 Q1545 970 1480 895 Z" fill="#ecfdf5" stroke="#15803d" stroke-width="3"/>
    <text x="1265" y="932" class="label">Display Owner Inventory</text>
    <text x="1265" y="966" class="small">Total Palay and Milled Rice balances</text>
    <text x="1265" y="994" class="small">Rice-type breakdown and combined stock</text>
    <text x="1265" y="1022" class="small">Read-only inventory movement logs</text>
  </g>

  <!-- User action decision -->
  <g filter="url(#shadow)">
    <polygon points="800,1090 945,1150 800,1210 655,1150" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
    <text x="800" y="1140" class="label">Refresh</text>
    <text x="800" y="1166" class="label">Inventory?</text>
  </g>

  <!-- Return connector A -->
  <g filter="url(#shadow)">
    <path d="M1135 1095 H1285 V1155 L1210 1200 L1135 1155 Z" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
    <text x="1210" y="1138" class="label">A</text>
    <text x="1210" y="1166" class="small">Owner menu</text>
  </g>

  <!-- Flow lines -->
  <path d="M800 216 V255" class="flow"/>
  <path d="M800 333 V378" class="flow"/>
  <path d="M630 450 H515" class="flow"/>
  <text x="556" y="433" class="branch">No</text>
  <path d="M800 522 V570" class="flow"/>
  <text x="816" y="551" class="branch">Yes</text>
  <path d="M1000 615 H1150" class="dataflow"/>
  <path d="M1150 638 H1080 V687 H875" class="dataflow"/>
  <path d="M800 660 V715" class="flow"/>
  <path d="M800 845 V895" class="flow"/>
  <path d="M620 970 H525" class="flow"/>
  <text x="560" y="953" class="branch">No</text>
  <path d="M980 970 H990" class="flow"/>
  <text x="984" y="953" class="branch">Yes</text>

  <!-- Both displays lead to action -->
  <path d="M310 1010 V1065 H700 V1108" class="flow"/>
  <path d="M1265 1045 V1065 H900 V1108" class="flow"/>

  <!-- Refresh or return -->
  <path d="M655 1150 H430 V615 H600" class="flow"/>
  <text x="584" y="1133" class="branch">Yes</text>
  <path d="M945 1150 H1135" class="flow"/>
  <text x="1014" y="1133" class="branch">No / Back</text>
</svg>
