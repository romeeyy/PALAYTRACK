<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1160" viewBox="0 0 1500 1160" role="img" aria-labelledby="title desc">
  <title id="title">A.1 Owner Dashboard Flowchart</title>
  <desc id="desc">Detailed subprocess flow when the owner selects Dashboard from the Owner navigation menu.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8fafc"/><stop offset="1" stop-color="#eef7ec"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#0f172a" flood-opacity=".12"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#475569"/></marker>
    <style>
      .title{font:800 34px Arial,sans-serif;fill:#0f172a}.subtitle{font:400 17px Arial,sans-serif;fill:#64748b}
      .label{font:700 18px Arial,sans-serif;fill:#0f172a;text-anchor:middle;dominant-baseline:middle}.small{font:600 14px Arial,sans-serif;fill:#475569;text-anchor:middle}
      .branch{font:700 15px Arial,sans-serif;fill:#334155}.flow{fill:none;stroke:#475569;stroke-width:3;marker-end:url(#arrow)}
      .dataflow{fill:none;stroke:#2563eb;stroke-width:2.5;stroke-dasharray:8 6;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1500" height="1120" fill="url(#bg)"/>
  <text x="750" y="48" class="title" text-anchor="middle">A.1 — Owner Dashboard Flowchart</text>
  <text x="750" y="78" class="subtitle" text-anchor="middle">Runs when the Owner selects “Dashboard” from the navigation menu</text>

  <!-- Off-page connector from Owner menu -->
  <g filter="url(#shadow)">
    <path d="M675 110 H825 V172 L750 218 L675 172 Z" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
    <text x="750" y="157" class="label">A.1</text>
  </g>

  <!-- Request process -->
  <g filter="url(#shadow)">
    <rect x="570" y="260" width="360" height="76" fill="#fff" stroke="#64748b" stroke-width="3"/>
    <text x="750" y="289" class="label">Request Owner Dashboard</text>
    <text x="750" y="317" class="small">Open dashboard page</text>
  </g>

  <!-- Authorization decision -->
  <g filter="url(#shadow)">
    <polygon points="750,382 920,455 750,528 580,455" fill="#fef3c7" stroke="#d97706" stroke-width="3"/>
    <text x="750" y="444" class="label">Authenticated</text>
    <text x="750" y="470" class="label">Owner?</text>
  </g>

  <!-- Denied display -->
  <g filter="url(#shadow)">
    <path d="M135 415 Q95 455 135 495 H425 Q485 455 425 415 Z" fill="#fff1f2" stroke="#e11d48" stroke-width="3"/>
    <text x="280" y="446" class="label">Display Login Page</text>
    <text x="280" y="474" class="small">Access denied</text>
  </g>

  <!-- Load data process -->
  <g filter="url(#shadow)">
    <rect x="570" y="575" width="360" height="84" fill="#fff" stroke="#64748b" stroke-width="3"/>
    <text x="750" y="605" class="label">Load Dashboard Data</text>
    <text x="750" y="635" class="small">Query current operational records</text>
  </g>

  <!-- Databases -->
  <g filter="url(#shadow)">
    <path d="M1050 545 C1050 522 1220 522 1220 545 V625 C1220 648 1050 648 1050 625 Z" fill="#e0f2fe" stroke="#0284c7" stroke-width="3"/>
    <ellipse cx="1135" cy="545" rx="85" ry="23" fill="#bae6fd" stroke="#0284c7" stroke-width="3"/>
    <path d="M1050 585 C1050 608 1220 608 1220 585" fill="none" stroke="#0284c7" stroke-width="2"/>
    <text x="1135" y="572" class="label">System Database</text>
    <text x="1135" y="625" class="small">Deliveries, inventory, payments</text>
  </g>

  <!-- Calculation process -->
  <g filter="url(#shadow)">
    <rect x="485" y="713" width="530" height="116" fill="#f0fdf4" stroke="#15803d" stroke-width="3"/>
    <text x="750" y="744" class="label">Calculate Dashboard Summaries</text>
    <text x="750" y="775" class="small">Current inventory and delivery counts</text>
    <text x="750" y="800" class="small">Paid daily/monthly income, 7-day trend, monthly analytics</text>
  </g>

  <!-- Dashboard display -->
  <g filter="url(#shadow)">
    <path d="M460 874 Q400 934 460 994 H1040 Q1110 934 1040 874 Z" fill="#ecfdf5" stroke="#15803d" stroke-width="3"/>
    <text x="750" y="910" class="label">Display Owner Dashboard</text>
    <text x="750" y="942" class="small">Inventory • Deliveries • Business Insights • Analytics</text>
    <text x="750" y="969" class="small">Show current values and charts</text>
  </g>

  <!-- Continue decision -->
  <g filter="url(#shadow)">
    <polygon points="750,1025 885,1075 750,1125 615,1075" fill="#fef3c7" stroke="#d97706" stroke-width="3"/>
    <text x="750" y="1065" class="label">Refresh</text>
    <text x="750" y="1090" class="label">Dashboard?</text>
  </g>

  <!-- Return connector -->
  <g filter="url(#shadow)">
    <path d="M1150 1025 H1300 V1080 L1225 1120 L1150 1080 Z" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
    <text x="1225" y="1064" class="label">A</text>
    <text x="1225" y="1090" class="small">Owner menu</text>
  </g>

  <!-- Flows -->
  <path d="M750 218 V260" class="flow"/>
  <path d="M750 336 V382" class="flow"/>
  <path d="M580 455 H485" class="flow"/>
  <text x="520" y="438" class="branch">No</text>
  <path d="M750 528 V575" class="flow"/>
  <text x="766" y="555" class="branch">Yes</text>
  <path d="M930 617 H1050" class="dataflow"/>
  <path d="M1050 625 H970 V680 H830" class="dataflow"/>
  <path d="M750 659 V713" class="flow"/>
  <path d="M750 829 V874" class="flow"/>
  <path d="M750 994 V1025" class="flow"/>

  <!-- Refresh loop and return -->
  <path d="M615 1075 H350 V617 H570" class="flow"/>
  <text x="530" y="1057" class="branch">Yes</text>
  <path d="M885 1075 H1150" class="flow"/>
  <text x="1010" y="1057" class="branch">No / Select another menu</text>
</svg>
